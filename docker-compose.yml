services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crimap-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - crimap_mssql:/var/opt/mssql
    restart: unless-stopped
volumes:
  crimap_mssql:
